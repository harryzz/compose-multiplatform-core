import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
    alias(libs.plugins.kotlinSerialization)
}
androidXMultiplatform {
    androidLibrary {
        namespace = "org.jetbrains.savedstate.compose"
    }
    desktop()
    mingwX64()
    linux()
    mac()
    ios()
    tvos()
    watchos()
    js()
    wasmJs()
    wasmWasi()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                def version = project.findProperty('artifactRedirection.version.androidx.savedstate')
                api("androidx.savedstate:savedstate-compose:$version")

                // Keep direct references to fork versions to correctly resolve
                // New redirections to Google's artifacts
                api(project(":savedstate:savedstate"))
                api("org.jetbrains.compose.runtime:runtime:1.9.3")
            }
        }
        wasmWasiUpstreamCommon {
            dependsOn(commonMain)
            kotlin.srcDirs += [
                "$rootDir/savedstate/savedstate-compose/src/commonMain/kotlin",
            ]
            dependencies {
                api(libs.kotlinSerializationCore)
            }
        }
        wasmWasiMain {
            dependsOn(wasmWasiUpstreamCommon)
            kotlin {
                srcDirs += [
                    "$rootDir/savedstate/savedstate-compose/src/nonAndroidMain/kotlin",
                ]
                // Patched copy lives in src/wasmWasiMain/kotlin
                exclude("**/LocalSavedStateRegistryOwner.nonAndroid.kt")
            }
            dependencies {
                api("org.jetbrains.compose.runtime:runtime-wasm-wasi:9999.0.0-SNAPSHOT")
                api("org.jetbrains.androidx.savedstate:savedstate-wasm-wasi:9999.0.0-SNAPSHOT")
            }
        }
    }
}

configurations.matching { it.name.startsWith("wasmWasi") }.all {
    exclude group: "androidx.savedstate", module: "savedstate-compose"
    exclude group: "androidx.savedstate", module: "savedstate"
    exclude group: "androidx.compose.runtime", module: "runtime"
    exclude group: "androidx.lifecycle", module: "lifecycle-common"
    exclude group: "androidx.annotation", module: "annotation"
    exclude group: "androidx.collection", module: "collection"
    exclude group: "org.jetbrains.compose.runtime", module: "runtime"
    exclude group: "org.jetbrains.androidx.savedstate", module: "savedstate"
    exclude group: "org.jetbrains.androidx.lifecycle", module: "lifecycle-common"
}

androidx {
    name = "Saved State Compose"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2024"
    description = "Compose integration with Saved State"
}
