import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    jvm()
    mac()
    linux()
    ios()
    watchos()
    tvos()
    mingwX64()
    js()
    wasmJs()
    wasmWasi()

    defaultPlatform(PlatformIdentifier.JVM)

    sourceSets {
        commonMain {
            commonMain {
                dependencies {
                    def version = project.findProperty('artifactRedirection.version.androidx.lifecycle')
                    api("androidx.lifecycle:lifecycle-common:$version")
                }
            }
        }
        wasmWasiUpstreamCommon {
            dependsOn(commonMain)
            kotlin.srcDirs += [
                "$rootDir/lifecycle/lifecycle-common/src/commonMain/kotlin",
            ]
        }
        wasmWasiUpstreamCommon.dependencies {
            // commonMain srcs require kotlinx.coroutines (StateFlow, etc.).
            // Pull in via libs catalog so wasi variant is selected.
            api(libs.kotlinCoroutinesCore)
        }
        wasmWasiMain {
            dependsOn(wasmWasiUpstreamCommon)
            kotlin.srcDirs += [
                "$rootDir/lifecycle/lifecycle-common/src/nonJvmMain/kotlin",
            ]
            dependencies {
                // androidx.annotation.{MainThread,RestrictTo} imports — pull
                // our locally-published annotation klib directly. The umbrella
                // KMP metadata module variant resolution is bypassed since
                // we depend on the wasm-wasi-specific artifact.
                api("org.jetbrains.compose.annotation-internal:annotation-wasm-wasi:9999.0.0-SNAPSHOT")
                // upstream nonJvmMain uses atomicfu.atomic
                implementation(libs.atomicFu)
            }
        }
    }
}

configurations.matching { it.name.startsWith("wasmWasi") }.all {
    exclude group: "androidx.lifecycle", module: "lifecycle-common"
    exclude group: "androidx.annotation", module: "annotation"
}

androidx {
    name = "Lifecycle-Common"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2017"
    description = "Android Lifecycle-Common"
}
