/**
 * This file was created using the `create_project.py` script located in the
 * `<AndroidX root>/development/project-creator` directory.
 *
 * Please use that script when creating a new project, rather than copying an existing project and
 * modifying its settings.
 */

import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    androidLibrary {
        namespace = "androidx.lifecycle.viewmodel.compose"
    }
    desktop()
    mac()
    linux()
    ios()
    watchos()
    tvos()
    mingwX64()
    js()
    wasmJs()
    wasmWasi()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                def version = project.findProperty("artifactRedirection.version.androidx.lifecycle")
                api("androidx.lifecycle:lifecycle-viewmodel-compose:$version")

                // Keep direct references to fork versions to correctly resolve
                // new redirections to Google's artifacts.
                api(project(":lifecycle:lifecycle-common"))
                api(project(":lifecycle:lifecycle-viewmodel"))
                api(project(":lifecycle:lifecycle-viewmodel-savedstate"))
                api(project(":compose:runtime:runtime"))
                api(project(":compose:runtime:runtime-saveable"))
            }
        }
        wasmWasiUpstreamCommon {
            dependsOn(commonMain)
            kotlin.srcDirs += [
                "$rootDir/lifecycle/lifecycle-viewmodel-compose/src/commonMain/kotlin",
            ]
        }
        wasmWasiMain {
            dependsOn(wasmWasiUpstreamCommon)
            kotlin {
                srcDirs += [
                    "$rootDir/lifecycle/lifecycle-viewmodel-compose/src/nonJvmMain/kotlin",
                ]
                exclude("**/*.nonJvm.kt")
            }
            dependencies {
                // lifecycle-runtime-compose isn't a project dep — pull from m2.
                implementation("org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose-wasm-wasi:9999.0.0-SNAPSHOT")
            }
        }
    }
}

configurations.matching { it.name.startsWith("wasmWasi") }.all {
    exclude group: "androidx.lifecycle", module: "lifecycle-viewmodel-compose"
    exclude group: "androidx.lifecycle", module: "lifecycle-viewmodel-savedstate"
    exclude group: "androidx.lifecycle", module: "lifecycle-viewmodel"
    exclude group: "androidx.lifecycle", module: "lifecycle-common"
    exclude group: "androidx.lifecycle", module: "lifecycle-runtime-compose"
    exclude group: "androidx.lifecycle", module: "lifecycle-runtime"
    exclude group: "androidx.compose.runtime", module: "runtime-saveable"
    exclude group: "androidx.compose.runtime", module: "runtime"
    exclude group: "androidx.annotation", module: "annotation"
    exclude group: "androidx.collection", module: "collection"
    exclude group: "androidx.savedstate", module: "savedstate"
    // Transitive m2 duplicates collide with our project(...) deps' local klibs.
    exclude group: "org.jetbrains.compose.runtime", module: "runtime"
    exclude group: "org.jetbrains.androidx.lifecycle", module: "lifecycle-viewmodel"
    // Do NOT exclude lifecycle-common — needed via m2 for lifecycle-runtime-compose
    // transitive resolution (LifecycleOwner reference in RememberViewModelStoreProvider).
}

androidx {
    name = "Lifecycle ViewModel Compose"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2021"
    description = "Compose integration with Lifecycle ViewModel"
}
