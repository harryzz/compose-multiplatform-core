import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    androidLibrary {
        compileSdk = 36
        namespace = "androidx.navigationevent.compose"
    }
    desktop()
    mac()
    linux()
    ios()
    watchos()
    tvos()
    mingwX64()
    js()
    wasmJs()
    wasmWasi()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        def navigationEventVersion = project.findProperty('artifactRedirection.version.androidx.navigationevent')

        commonMain.dependencies {
            api("androidx.navigationevent:navigationevent-compose:$navigationEventVersion")

            // Keep direct references to fork versions to correctly resolve
            // new redirections to Google's artifacts.
            api(project(":compose:runtime:runtime"))
        }
        wasmWasiUpstreamCommon {
            dependsOn(commonMain)
            kotlin.srcDirs += [
                "$rootDir/navigationevent/navigationevent-compose/src/commonMain/kotlin",
                // navigationevent base module isn't registered — pull its
                // source straight in so navigationevent.* refs resolve.
                "$rootDir/navigationevent/navigationevent/src/commonMain/kotlin",
                // runtime-annotation classes (Stable/Immutable/etc.) already
                // shipped by org.jetbrains.compose.runtime:runtime-wasm-wasi —
                // pulling them here too would duplicate IR symbols and trip
                // the linker with "IrClassSymbolImpl is already bound".
            ]
            dependencies {
                api(libs.kotlinCoroutinesCore)
            }
            languageSettings {
                optIn("kotlin.contracts.ExperimentalContracts")
            }
        }
        wasmWasiMain {
            dependsOn(wasmWasiUpstreamCommon)
            kotlin {
                srcDirs += [
                    "$rootDir/navigationevent/navigationevent-compose/src/nonJvmMain/kotlin",
                    "$rootDir/navigationevent/navigationevent/src/webMain/kotlin",
                ]
                exclude("**/*.nonJvm.kt")
            }
            dependencies {
                api("org.jetbrains.compose.annotation-internal:annotation-wasm-wasi:9999.0.0-SNAPSHOT")
                implementation("org.jetbrains.compose.collection-internal:collection-wasm-wasi:9999.0.0-SNAPSHOT")
            }
            languageSettings {
                optIn("kotlin.contracts.ExperimentalContracts")
            }
        }
    }
}

configurations.matching { it.name.startsWith("wasmWasi") }.all {
    exclude group: "androidx.navigationevent", module: "navigationevent-compose"
    exclude group: "androidx.navigationevent", module: "navigationevent"
    exclude group: "androidx.compose.runtime", module: "runtime"
    exclude group: "androidx.compose.runtime", module: "runtime-annotation"
    exclude group: "androidx.annotation", module: "annotation"
    exclude group: "androidx.collection", module: "collection"
}

androidx {
    name = "NavigationEvent Compose"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2025"
    description = "Compose integration with NavigationEvent"
}
