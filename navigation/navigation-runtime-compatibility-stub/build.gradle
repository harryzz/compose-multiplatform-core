import androidx.build.PlatformIdentifier
import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
    alias(libs.plugins.kotlinSerialization)
}

androidXMultiplatform {
    androidLibrary {
        namespace = "androidx.navigation"
    }
    desktop()
    linux()
    mac()
    watchos()
    tvos()
    ios()
    js()
    wasmJs()
    wasmWasi()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                def version = project.findProperty("artifactRedirection.version.androidx.navigation")
                api("androidx.navigation:navigation-runtime:$version")

                // Keep direct references to fork versions to correctly resolve
                // new redirections to Google's artifacts.
                api(project(":navigation:navigation-common"))
                api("org.jetbrains.androidx.lifecycle:lifecycle-common:2.11.0-beta01")
                api("org.jetbrains.androidx.lifecycle:lifecycle-runtime:2.11.0-beta01")
                api("org.jetbrains.androidx.lifecycle:lifecycle-viewmodel:2.11.0-beta01")
            }
        }
        wasmWasiUpstreamCommon {
            dependsOn(commonMain)
            kotlin.srcDirs += [
                "$rootDir/navigation/navigation-runtime/src/commonMain/kotlin",
            ]
            dependencies {
                api(libs.kotlinCoroutinesCore)
                api(libs.kotlinSerializationCore)
            }
        }
        wasmWasiMain {
            dependsOn(wasmWasiUpstreamCommon)
            kotlin {
                srcDirs += [
                    "$rootDir/navigation/navigation-runtime/src/nonAndroidMain/kotlin",
                    "$rootDir/navigation/navigation-runtime/src/nonJvmMain/kotlin",
                    "$rootDir/navigation/navigation-runtime/src/webMain/kotlin",
                ]
                // Patched copies in src/wasmWasiMain/kotlin (named *.wasmWasi.kt)
                exclude("**/*.nonAndroid.kt")
                exclude("**/*.nonJvm.kt")
                // Browser DOM-specific — uses JS `external interface` which
                // isn't valid on wasmWasi.
                exclude("**/BrowserHistory.kt")
            }
            dependencies {
                api("org.jetbrains.compose.annotation-internal:annotation-wasm-wasi:9999.0.0-SNAPSHOT")
                implementation("org.jetbrains.compose.collection-internal:collection-wasm-wasi:9999.0.0-SNAPSHOT")
                // navigation-common already provided via project(...) dep above —
                // do not duplicate via m2 or both will land on classpath.
                api("org.jetbrains.androidx.lifecycle:lifecycle-common-wasm-wasi:9999.0.0-SNAPSHOT")
                api("org.jetbrains.androidx.lifecycle:lifecycle-runtime-wasm-wasi:9999.0.0-SNAPSHOT")
                api("org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-wasm-wasi:9999.0.0-SNAPSHOT")
                api("org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate-wasm-wasi:9999.0.0-SNAPSHOT")
                api("org.jetbrains.androidx.savedstate:savedstate-wasm-wasi:9999.0.0-SNAPSHOT")
            }
        }
    }
}

configurations.matching { it.name.startsWith("wasmWasi") }.all {
    exclude group: "androidx.navigation", module: "navigation-runtime"
    exclude group: "androidx.navigation", module: "navigation-common"
    exclude group: "androidx.annotation", module: "annotation"
    exclude group: "androidx.collection", module: "collection"
    exclude group: "androidx.lifecycle", module: "lifecycle-common"
    exclude group: "androidx.lifecycle", module: "lifecycle-runtime"
    exclude group: "androidx.lifecycle", module: "lifecycle-viewmodel"
    exclude group: "androidx.lifecycle", module: "lifecycle-viewmodel-savedstate"
    exclude group: "androidx.savedstate", module: "savedstate"
    exclude group: "org.jetbrains.androidx.lifecycle", module: "lifecycle-common"
    exclude group: "org.jetbrains.androidx.lifecycle", module: "lifecycle-runtime"
    exclude group: "org.jetbrains.androidx.lifecycle", module: "lifecycle-viewmodel"
    exclude group: "org.jetbrains.androidx.lifecycle", module: "lifecycle-viewmodel-savedstate"
    exclude group: "org.jetbrains.androidx.savedstate", module: "savedstate"
}

androidx {
    name = "Navigation Runtime"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2017"
    description = "Android Navigation-Runtime"
}
