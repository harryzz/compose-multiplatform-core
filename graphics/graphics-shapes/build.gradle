import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier
import org.jetbrains.androidx.build.JetBrainsAndroidXPlugin
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
}

// JetBrainsAndroidXPlugin static helper removed in this fork — apply via id() above.

androidXMultiplatform {
    androidLibrary {
        namespace = "androidx.graphics.shapes"
    }
    desktop()
    mac()
    linux()
    ios()
    tvos()
    watchos()
    mingwX64()
    js()
    wasmJs()
    wasmWasi()

    defaultPlatform(PlatformIdentifier.ANDROID)
}

kotlin {

    sourceSets {
        configureEach {
            languageSettings.optIn("kotlin.RequiresOptIn")
            languageSettings.optIn("kotlin.contracts.ExperimentalContracts")
        }

        commonMain {
            dependencies {
                implementation(libs.kotlinStdlib)
                implementation(project(":collection:collection"))
                implementation(project(":annotation:annotation"))
            }
        }

        commonTest {
            dependencies {
                implementation(libs.kotlinTest)
                implementation(project(":kruth:kruth"))
            }
        }

        jvmMain {
            dependsOn(commonMain)
            dependencies {
            }
        }

        jvmTest {
            dependsOn(commonTest)
            dependencies {
            }
        }

        androidMain {
            dependsOn(jvmMain)
            dependencies {
                implementation("androidx.core:core-ktx:1.10.0")
                implementation("androidx.annotation:annotation-experimental:1.4.1")
            }
        }

        androidInstrumentedTest {
            dependsOn(jvmTest)
            dependencies {
                implementation(libs.testRules)
                implementation(libs.testRunner)
                implementation(libs.junit)
            }
        }

        desktopMain {
            dependsOn(jvmMain)
        }

        desktopTest {
            dependsOn(jvmTest)
        }

        nonJvmMain {
            dependsOn(commonMain)
        }

        nonJvmTest {
            dependsOn(commonTest)
        }

        nativeMain {
            dependsOn(nonJvmMain)
        }

        nativeTest {
            dependsOn(nonJvmTest)
        }

        // jsMain/wasmJsMain/wasmJsTest stdlib pins removed — current libs.versions.toml
        // doesn't expose the per-target stdlib aliases the older fork used.
        targets.configureEach { target ->
            if (target.platformType == KotlinPlatformType.native) {
                target.compilations["main"].defaultSourceSet.dependsOn(nativeMain)
                target.compilations["test"].defaultSourceSet.dependsOn(nativeTest)
            }
        }
    }
}

androidx {
    name = "Graphics Shapes"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    mavenVersion = LibraryVersions.GRAPHICS_SHAPES
    inceptionYear = "2022"
    description = "create and render rounded polygonal shapes"
    legacyDisableKotlinStrictApiMode = true
}

configurations.matching { it.name.startsWith("wasmWasi") }.all {
    exclude group: "androidx.collection", module: "collection"
    exclude group: "androidx.annotation", module: "annotation"
    resolutionStrategy.dependencySubstitution {
        // commonMain declares project(":collection:collection") and
        // project(":annotation:annotation"). For the wasmWasi target we
        // want the published m2 klibs instead — otherwise the project
        // build output AND the m2 klib both land on the compile
        // classpath and the KLIB loader rejects the duplicate
        // unique_name. substitute(module(...)) does NOT catch a
        // project(...) dependency, so the project form must be
        // substituted explicitly.
        substitute(project(":collection:collection")).using(
            module("org.jetbrains.compose.collection-internal:collection:9999.0.0-SNAPSHOT")
        )
        substitute(project(":annotation:annotation")).using(
            module("org.jetbrains.compose.annotation-internal:annotation:9999.0.0-SNAPSHOT")
        )
        substitute(module("org.jetbrains.compose.collection-internal:collection")).using(
            module("org.jetbrains.compose.collection-internal:collection:9999.0.0-SNAPSHOT")
        )
        substitute(module("org.jetbrains.compose.annotation-internal:annotation")).using(
            module("org.jetbrains.compose.annotation-internal:annotation:9999.0.0-SNAPSHOT")
        )
    }
}
