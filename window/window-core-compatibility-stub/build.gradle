import androidx.build.PlatformIdentifier
import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    desktop()
    androidLibrary {
        namespace = "org.jetbrains.window.core"
    }
    mac()
    linux()
    ios()
    watchos()
    tvos()
    mingwX64()
    js()
    wasmJs()
    wasmWasi()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                def version = project.findProperty('artifactRedirection.version.androidx.window')
                api("androidx.window:window-core:$version")
            }
        }
        // wasmWasi has no published variant. Pull upstream commonMain into an
        // intermediate sourceset (no nonJvmMain or actuals exist for this
        // module, so wasmWasiMain itself stays empty).
        wasmWasiUpstreamCommon {
            dependsOn(commonMain)
            kotlin.srcDirs += [
                "$rootDir/window/window-core/src/commonMain/kotlin",
            ]
        }
        wasmWasiMain {
            dependsOn(wasmWasiUpstreamCommon)
        }
    }
}

configurations.matching { it.name.startsWith("wasmWasi") }.all {
    exclude group: "androidx.window", module: "window-core"
}

androidx {
    name = "WindowManager Core"
    type = SoftwareType.PUBLISHED_LIBRARY
    inceptionYear = "2022"
    description = "WindowManager Core Library."
}
