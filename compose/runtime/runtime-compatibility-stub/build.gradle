import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier
import com.android.build.api.dsl.KotlinMultiplatformAndroidHostTestCompilation

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    androidLibrary {
        namespace = "org.jetbrains.compose.runtime"
    }
    desktop()
    mingwX64()
    linux()
    mac()
    ios()
    tvos()
    watchos()
    js()
    wasmJs()
    wasmWasi()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                def version = project.findProperty('artifactRedirection.version.androidx.compose')
                api("androidx.compose.runtime:runtime:$version")
            }
        }
        // wasmWasiUpstreamCommon holds expects only (commonMain) — must be a
        // distinct fragment from any actual-providing source set.
        wasmWasiUpstreamCommon {
            dependsOn(commonMain)
            kotlin.srcDirs += [
                "$rootDir/compose/runtime/runtime/src/commonMain/kotlin",
                // runtime-annotation isn't a registered Gradle project (only on
                // disk); pull its commonMain straight into our intermediate.
                "$rootDir/compose/runtime/runtime-annotation/src/commonMain/kotlin",
            ]
            dependencies {
                api(libs.kotlinCoroutinesCore)
            }
            languageSettings {
                optIn("kotlin.contracts.ExperimentalContracts")
                optIn("kotlin.experimental.ExperimentalNativeApi")
            }
        }
        wasmWasiMain {
            dependsOn(wasmWasiUpstreamCommon)
            kotlin {
                srcDirs += [
                    "$rootDir/compose/runtime/runtime/src/nonAndroidMain/kotlin",
                    "$rootDir/compose/runtime/runtime/src/nonJvmMain/kotlin",
                    "$rootDir/compose/runtime/runtime/src/webMain/kotlin",
                ]
                // Patched *.wasmWasi.kt copies live in src/wasmWasiMain/kotlin.
                exclude("**/SnapshotStateSet.nonAndroid.kt")
                exclude("**/SnapshotStateList.nonAndroid.kt")
            }
            dependencies {
                api("org.jetbrains.compose.annotation-internal:annotation-wasm-wasi:9999.0.0-SNAPSHOT")
                implementation("org.jetbrains.compose.collection-internal:collection-wasm-wasi:9999.0.0-SNAPSHOT")
                implementation(libs.atomicFu)
            }
            languageSettings {
                optIn("kotlin.contracts.ExperimentalContracts")
                optIn("kotlin.experimental.ExperimentalNativeApi")
            }
        }
    }
}

configurations.matching { it.name.startsWith("wasmWasi") }.all {
    exclude group: "androidx.compose.runtime", module: "runtime"
    exclude group: "androidx.annotation", module: "annotation"
    exclude group: "androidx.collection", module: "collection"
}

androidx {
    name = "Compose Runtime"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2019"
    description = "Tree composition support for code generated by the Compose compiler plugin and corresponding public API"
}
