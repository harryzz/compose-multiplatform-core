import androidx.build.PlatformIdentifier
import androidx.build.SoftwareType

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
    alias(libs.plugins.kotlinSerialization)
}

androidXMultiplatform {
    androidLibrary {
        namespace = "org.jetbrains.compose.runtime.saveable"
    }
    desktop()
    mingwX64()
    linux()
    mac()
    ios()
    tvos()
    watchos()
    js()
    wasmJs()
    wasmWasi()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                def version = project.findProperty('artifactRedirection.version.androidx.compose')
                api("androidx.compose.runtime:runtime-saveable:$version")

                // Keep direct references to fork versions to correctly resolve
                // New redirections to Google's artifacts
                api(project(":compose:runtime:runtime"))
                implementation("org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose:2.9.6")
                api("org.jetbrains.androidx.savedstate:savedstate-compose:1.3.6")
            }
        }
        wasmWasiUpstreamCommon {
            dependsOn(commonMain)
            kotlin.srcDirs += [
                "$rootDir/compose/runtime/runtime-saveable/src/commonMain/kotlin",
            ]
            dependencies {
                api(libs.kotlinSerializationCore)
            }
        }
        wasmWasiMain {
            dependsOn(wasmWasiUpstreamCommon)
            dependencies {
                implementation("org.jetbrains.compose.collection-internal:collection-wasm-wasi:9999.0.0-SNAPSHOT")
                implementation("org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose-wasm-wasi:9999.0.0-SNAPSHOT")
                api("org.jetbrains.androidx.savedstate:savedstate-compose-wasm-wasi:9999.0.0-SNAPSHOT")
            }
        }
    }
}

configurations.matching { it.name.startsWith("wasmWasi") }.all {
    exclude group: "androidx.compose.runtime", module: "runtime-saveable"
    exclude group: "androidx.compose.runtime", module: "runtime"
    exclude group: "androidx.lifecycle", module: "lifecycle-runtime-compose"
    exclude group: "androidx.lifecycle", module: "lifecycle-runtime"
    exclude group: "androidx.lifecycle", module: "lifecycle-common"
    exclude group: "androidx.savedstate", module: "savedstate-compose"
    exclude group: "androidx.savedstate", module: "savedstate"
    exclude group: "androidx.annotation", module: "annotation"
    exclude group: "androidx.collection", module: "collection"
    // commonMain pins specific JetBrains-fork versions (2.9.6/1.3.6) without
    // wasm-wasi variants. Substitute our local 9999.0.0-SNAPSHOT via the
    // wasmWasiMain dependencies above.
    exclude group: "org.jetbrains.androidx.lifecycle", module: "lifecycle-runtime-compose"
    exclude group: "org.jetbrains.androidx.savedstate", module: "savedstate-compose"
    // compose-runtime arrives via project(":compose:runtime:runtime") in
    // commonMain; transitively pulled m2 copy from lifecycle-runtime-compose
    // would collide on unique_name.
    exclude group: "org.jetbrains.compose.runtime", module: "runtime"
}

androidx {
    name = "Compose Saveable"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2020"
    description = "Compose components that allow saving and restoring the local ui state"
}
