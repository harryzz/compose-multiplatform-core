import androidx.build.PlatformIdentifier
import androidx.build.SoftwareType
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
}

androidXMultiplatform {
    androidLibrary {
        namespace = "androidx.compose.ui.backhandler"
    }
    desktop()
    mac()
    ios()
    js()
    wasmJs()
    wasmWasi()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain {
            dependencies {
                implementation(libs.kotlinCoroutinesCore)
                implementation("androidx.annotation:annotation:1.9.1")
                implementation(project(":compose:runtime:runtime"))
                implementation(project(":compose:ui:ui-util"))
            }
        }

        commonTest {
            dependencies {
                implementation(libs.kotlinTest)
            }
        }

        androidMain {
            dependencies {
                api("androidx.activity:activity-compose:1.8.0")
            }
        }

        def navigationEventVersion = project.findProperty('artifactRedirection.version.androidx.navigationevent')

        // TODO: Align naming: nonAndroidMain
        jbMain {
            dependsOn(commonMain)
            dependencies {
                implementation("androidx.navigationevent:navigationevent-compose:$navigationEventVersion")
            }
        }

        jbTest {
            dependsOn(commonTest)
        }

        desktopMain {
            dependsOn(jbMain)
        }

        desktopTest {
            dependsOn(jbTest)
        }

        nativeMain {
            dependsOn(jbMain)
        }

        nativeTest {
            dependsOn(jbTest)
        }

        webMain {
            dependsOn(jbMain)
        }

        webTest {
            dependsOn(jbTest)
        }

        wasmWasiMain {
            dependsOn(jbMain)
            dependencies {
                implementation("org.jetbrains.androidx.navigationevent:navigationevent-compose-wasm-wasi:9999.0.0-SNAPSHOT")
            }
        }
    }
}

configurations.matching { it.name.startsWith("wasmWasi") }.all {
    exclude group: "androidx.collection", module: "collection"
    exclude group: "androidx.annotation", module: "annotation"
    exclude group: "androidx.navigationevent", module: "navigationevent-compose"
    resolutionStrategy.dependencySubstitution {
        substitute(module("org.jetbrains.compose.collection-internal:collection")).using(
            module("org.jetbrains.compose.collection-internal:collection:9999.0.0-SNAPSHOT")
        )
        substitute(module("org.jetbrains.compose.annotation-internal:annotation")).using(
            module("org.jetbrains.compose.annotation-internal:annotation:9999.0.0-SNAPSHOT")
        )
    }
}

androidx {
    name = "Compose BackHandler"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2025"
    description = "Provides BackHandler in Compose Multiplatform projects"
    legacyDisableKotlinStrictApiMode = true
}
